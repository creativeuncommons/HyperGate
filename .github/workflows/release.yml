name: HyperGate Release & Cross-Compilation Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rust-binaries:
    name: Build Rust Native Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (musl static)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: hypergate-linux-x86_64
            use_cross: true

          # Linux aarch64 (musl static)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary_name: hypergate-linux-arm64
            use_cross: true

          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: hypergate-windows-x64.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for musl cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Native Binary
        working-directory: hypergate-rs
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage & Rename Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          SRC="hypergate-rs/target/${{ matrix.target }}/release/hypergate"
          cp "$SRC" "dist/${{ matrix.binary_name }}"
          chmod +x "dist/${{ matrix.binary_name }}" 2>/dev/null || true

      - name: Stage & Rename Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp "hypergate-rs/target/${{ matrix.target }}/release/hypergate.exe" "dist/${{ matrix.binary_name }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}

  build-macos-binaries:
    name: Build macOS Universal & Thin Binaries (arm64 & x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install Zig & cargo-zigbuild
        run: |
          pip install cargo-zigbuild ziglang

      - name: Build Apple Silicon Binary (aarch64)
        working-directory: hypergate-rs
        run: cargo zigbuild --release --target aarch64-apple-darwin

      - name: Build Intel Mac Binary (x86_64)
        working-directory: hypergate-rs
        run: cargo zigbuild --release --target x86_64-apple-darwin

      - name: Stage & Lipo Universal Binary
        run: |
          mkdir -p dist
          cp hypergate-rs/target/aarch64-apple-darwin/release/hypergate dist/hypergate-macos-arm64
          cp hypergate-rs/target/x86_64-apple-darwin/release/hypergate dist/hypergate-macos-x86_64
          LIPO_BIN=$(command -v llvm-lipo || ls /usr/bin/llvm-lipo* 2>/dev/null | head -n 1 || command -v lipo || echo "")
          if [ -n "$LIPO_BIN" ]; then
            $LIPO_BIN -create -output dist/hypergate-macos-universal dist/hypergate-macos-arm64 dist/hypergate-macos-x86_64
          else
            cp dist/hypergate-macos-arm64 dist/hypergate-macos-universal
          fi
          chmod +x dist/hypergate-macos-*

      - name: Upload Apple Silicon Binary
        uses: actions/upload-artifact@v4
        with:
          name: hypergate-macos-arm64
          path: dist/hypergate-macos-arm64

      - name: Upload Intel Mac Binary
        uses: actions/upload-artifact@v4
        with:
          name: hypergate-macos-x86_64
          path: dist/hypergate-macos-x86_64

      - name: Upload Universal Mac Binary
        uses: actions/upload-artifact@v4
        with:
          name: hypergate-macos-universal
          path: dist/hypergate-macos-universal

  package-release:
    name: Package Assets & Publish GitHub Release
    needs: [build-rust-binaries, build-macos-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Test Suites
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Organize Distribution Bundle
        run: |
          mkdir -p dist/packages
          
          # Copy standalone Python SDK
          cp hypergate-py/hypergate.py dist/packages/hypergate.py
          chmod +x dist/packages/hypergate.py
          
          # Flatten binary artifacts
          find release_artifacts -type f -exec cp {} dist/packages/ \;
          
          # Generate SHA-256 Checksums
          cd dist/packages
          sha256sum * > SHA256SUMS.txt
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/packages/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
